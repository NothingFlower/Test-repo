<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;background:linear-gradient(135deg,#10152f,#38246d 55%,#176b87)}
    .card{width:100%;max-width:430px;padding:36px;border:1px solid #ffffff33;border-radius:22px;background:#ffffff1a;box-shadow:0 20px 60px #0005;backdrop-filter:blur(14px)}
    .logo{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 18px;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#38bdf8);font-size:27px}
    h1{text-align:center;font-size:28px;margin-bottom:8px}
    .sub{text-align:center;color:#d7d7ed;font-size:14px;margin-bottom:26px}
    .field{margin-bottom:16px}
    label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
    input{width:100%;padding:13px 14px;border:1px solid #ffffff40;border-radius:10px;outline:none;color:#fff;background:#0c0f2860;font-size:15px}
    input::placeholder{color:#c4c5da}
    input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}
    .btn{width:100%;padding:14px;border:0;border-radius:10px;color:#fff;background:linear-gradient(90deg,#8b5cf6,#3b82f6);font-size:16px;font-weight:700;cursor:pointer;transition:transform .2s,filter .2s}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .message{min-height:20px;margin-top:14px;text-align:center;color:#fde68a;font-size:13px;line-height:1.5}
    .foot{text-align:center;margin-top:20px;color:#d7d7ed;font-size:13px}
    a{color:#b9a3ff;text-decoration:none}a:hover{text-decoration:underline}
    @media(max-width:440px){.card{padding:28px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">✦</div>
    <h1>Create Account</h1>
    <p class="sub">Join us — it only takes a minute</p>
    <form id="registerForm">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Enter your password again" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit">Create Account</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="foot">Already have an account? <a href="login_page.html">Log in</a></p>
    <p class="foot"><a href="home.html">← Back to home</a></p>
  </main>
  <script>
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (password.value !== confirmPassword.value) {
        message.textContent = "Passwords do not match. Please try again.";
        confirmPassword.focus();
        return;
      }
      message.textContent = "Demo only: connect a secure backend to create an account.";
    });
  </script>
</body>
</html>
